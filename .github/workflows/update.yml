name: Update World Cup feed

# Atualiza sozinho no schedule, e no clique manual (Actions -> Run workflow).
# OBS: NÃO usamos mais o gatilho "push em results.json" — ele criava uma cascata
# (o robô se re-disparava a cada placar salvo), gerando deploys do GitHub Pages
# a cada ~2 min. O Pages nao aguenta esse ritmo e recusa alguns ("try again later").
on:
  schedule:
    - cron: "*/10 * * * *"       # a cada 10 min — rapido o bastante e sem sobrecarregar o Pages
  workflow_dispatch:              # rodar manualmente quando quiser (ex.: apos editar results.json na mao)

permissions:
  contents: write                 # allow the action to commit the regenerated files

concurrency:
  group: wc-update                # nunca roda duas atualizacoes ao mesmo tempo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # 1) Resolve o chaveamento ATUAL (times reais de cada vaga) em data.json,
      #    pra que o fetch consiga reconhecer os jogos do mata-mata pelos nomes.
      - name: Pre-resolve bracket
        run: python build.py

      # 2) OPTIONAL: auto-fetch live scores. Add a repository secret named
      #    FOOTBALL_DATA_TOKEN (free at football-data.org) to enable it. Without
      #    the secret this step just no-ops; edit results.json by hand instead.
      - name: Fetch live results (optional)
        continue-on-error: true
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python fetch_results.py

      # 3) Rebuild final com os novos resultados (placar + chaveamento + standings).
      - name: Rebuild calendar + dashboard data
        run: python build.py

      - name: Commit changes if any
        run: |
          git config user.name "wc-bot"
          git config user.email "wc-bot@users.noreply.github.com"
          git add worldcup.ics data.json results.json
          git diff --staged --quiet || git commit -m "Update results $(TZ='America/New_York' date +'%Y-%m-%d %H:%M %Z')"
          git push
