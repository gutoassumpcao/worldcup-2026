name: Update World Cup feed

# Runs on a schedule, on manual click, and whenever you edit results.json.
on:
  schedule:
    - cron: "*/5 * * * *"        # a cada 5 min — pega o placar logo apos cada jogo terminar.
  workflow_dispatch:              # lets you run it manually from the Actions tab
  push:
    paths:
      - "results.json"            # rebuild instantly when you edit scores by hand

permissions:
  contents: write                 # allow the action to commit the regenerated files

concurrency:
  group: wc-update                # nunca roda duas atualizacoes ao mesmo tempo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # OPTIONAL: auto-fetch live scores. Add a repository secret named
      # FOOTBALL_DATA_TOKEN (free at football-data.org) to enable it. Without
      # the secret this step just no-ops; edit results.json by hand instead.
      - name: Fetch live results (optional)
        continue-on-error: true
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python fetch_results.py

      - name: Rebuild calendar + dashboard data
        run: python build.py

      - name: Commit changes if any
        run: |
          git config user.name "wc-bot"
          git config user.email "wc-bot@users.noreply.github.com"
          git add worldcup.ics data.json results.json
          git diff --staged --quiet || git commit -m "Update results $(TZ='America/New_York' date +'%Y-%m-%d %H:%M %Z')"
          git push
